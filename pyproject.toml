[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-superagent"
version = "0.1.0"
description = "A local Router/Worker super-agent prototype"
requires-python = ">=3.11"

[project.scripts]
superagent = "my_superagent.cli:main"

[tool.setuptools.packages.find]
include = ["my_superagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
